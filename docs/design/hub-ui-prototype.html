function money(c){return Object.entries(c).filter(([,v])=>v>0).map(([k,v])=>`${v.toLocaleString()} ${{tm:'TM',shards:'shards',galder:'Galder',ore:'Bronze Fragments'}[k]}`).join(' · ')||'No cost'}
function afford(cost){return Object.entries(cost).every(([k,v])=>(state.wallet[k]??0)>=v)}
function pay(cost){if(!afford(cost)){toast('Your banked resources changed. Review the price and try again.');return false}Object.entries(cost).forEach(([k,v])=>state.wallet[k]-=v);return true}
function receipt(text){state.receipts.unshift(text);toast(text);render()}
function title(x){return itemData(x).name+(x.refine?' +'+x.refine:'')}
function compatible(x,c=cls()){const d=itemData(x);if(d.slot==='weapon')return c.id==='lion'?d.family==='gun':d.family!=='gun';if(d.slot==='shield')return c.id!=='lion';return true}
function equipStats(x){const d=itemData(x),s={...d.stats},bonus=[0,4,9,15,23,33,45,60,78,98,120],flat={AP:2,DP:2,MA:1,MD:2};x.compounds.forEach(c=>{if(c.stat in cls().base)s[c.stat]=(s[c.stat]||0)+c.value});if(x.refine&&d.refine_stat in s){const k=d.refine_stat;s[k]+=Math.round(s[k]*bonus[x.refine]/100)+x.refine*(flat[k]||1)}return s}
function stats(){const s={...cls().base};Object.values(prep().equipment).map(item).filter(Boolean).forEach(x=>Object.entries(equipStats(x)).forEach(([k,v])=>s[k]=(s[k]||0)+v));Object.values(prep().wardrobe).map(ward).filter(Boolean).forEach(w=>Object.entries(w.stats).forEach(([k,v])=>s[k]=(s[k]||0)+v));if(!prep().equipment.weapon){const d=DATA.items.find(x=>x.id===cls().starter);if(d)Object.entries(d.stats).forEach(([k,v])=>s[k]=(s[k]||0)+v)}s.HP+=(state.restored.training_hall||0)*15;return s}
function statLine(s){return Object.entries(s).map(([k,v])=>`${esc(k)} ${v>=0?'+':''}${v}`).join(' · ')}
function skillChoice(){return cls().mastery.find(c=>c.id===prep().skill)}
function heat(ranks=state.settings){return Object.entries(DATA.settings).reduce((s,[id,v])=>s+(ranks[id]||0)*v.heat,0)}
function shell(content){const c=cls(),s=stats(),skill=skillChoice(),w=state.wallet;return `<header class="top"><div class="brand">Megalopolis</div><button onclick="openCharacters()">${esc(c.name)} ▾</button><button onclick="go('character')">Prepare character</button><button onclick="go('journal')">Journal${state.goal?' · 1 goal':''}</button><div class="grow"></div><div class="money"><small>Banked · shared across characters</small><br><strong>${w.tm.toLocaleString()} TM</strong> · ${w.shards} shards</div><button class="primary" onclick="go('gate')">Expedition →</button></header><div class="layout"><nav class="rail" aria-label="Prototype screen index"><small>PROTOTYPE SCREEN INDEX<br>Service selection simulates visiting its NPC.</small>${Object.entries(names).filter(([k])=>!['character','journal','gate'].includes(k)).map(([k,n])=>`<button class="${view===k?'active':''}" onclick="go('${k}')">${esc(n)}${!ready(k)?'<span class="lock">Closed</span>':''}</button>`).join('')}</nav><main class="main" id="screen">${content}</main><aside class="context"><span class="eyebrow">Next expedition</span><h2>${esc(c.name)}</h2><p class="muted">${esc(c.basic)} · first job</p><div class="statgrid">${['HP','AP','AC','DP'].map(k=>`<div class="stat"><small>${k}</small><strong>${s[k]}</strong></div>`).join('')}</div><div class="rule"></div><small>Starting technique</small><p><strong>${skill?esc(skill.name)+' · Lv '+state.mastery[skill.id]:'Class techniques only'}</strong></p><small>Drill</small><p>${prep().drill?esc(DATA.drills.find(x=>x.id===prep().drill).name):state.restored.drill_shop?'Basic Drill available':'Drilling not restored'}</p><small>Server settings</small><p>Heat ${heat()} · +${heat()*10}% TM</p><button onclick="go('character')">Inspect full preparation</button><div class="rule"></div><h3>Tracked hunt</h3>${state.goal?`<p>${esc(state.goal.name)}</p><small>${esc(state.goal.source)}</small><button onclick="state.goal=null;render()">Untrack</button>`:'<p class="muted">Track a material or missing card when you have a goal in mind.</p>'}</aside></div><footer class="footnote">Design prototype. Values come from the reviewed game data; preview totals simplify talent interactions. Actions remain in memory and reset on reload. Screen index is a review aid, not the proposed in-game remote-service menu.</footer>`}
function head(name,text){return `<div class="sectionhead"><div><span class="eyebrow">${services[view]?esc(services[view][0]):'Megalopolis'}</span><h1>${esc(name)}</h1><p class="muted">${esc(text)}</p></div>${services[view]?'<button onclick="showConversation()">Talk</button>':''}</div>`}
function render(){let body;if(!ready(view)){const r=restoration(unlock[view]);body=head(names[view],'This part of the town has not reopened yet.')+`<div class="card"><h2>${esc(r.name)}</h2><p>${esc(r.text)}</p><p class="cost">${money({tm:r.tm[0],shards:r.shards[0]})}</p><button class="primary" onclick="selected.restore='${r.id}';go('restore')">View restoration with Cavalier</button><p class="muted" style="margin-top:12px">You can keep preparing and leave without restoring this service.</p></div>`}else body=({town:townScreen,character:characterScreen,warehouse:equipmentScreen,restore:restoreScreen,refine:refineScreen,compound:compoundScreen,mastery:masteryScreen,cards:cardsScreen,drills:drillsScreen,difficulty:difficultyScreen,journal:journalScreen,gate:gateScreen}[view]||townScreen)();$('app').innerHTML=shell(body)}
function townScreen(){const fresh=state.mode==='fresh';return head('A little more of the city is awake.',fresh?'Choose who you want to play, meet the people in the square, and head out when you are ready.':'You are back in the square. Keep your next expedition simple, or take time to prepare.')+(!fresh?`<div class="notice"><strong>Last expedition · reached Desert Beach</strong><br>Banked 2,480 TM and 1 shard. A lost bag remains in Desert Beach, room 3.<div class="actions"><button onclick="openReturn()">Review what came home</button></div></div>`:'<div class="notice">All eight regular characters are available. Job branches and town services develop as you play.</div>')+`<div class="grid"><div class="card"><span class="eyebrow">Your character</span><h2>${esc(cls().name)}</h2><p>${esc(cls().basic)}</p><button onclick="openCharacters()">Choose character</button> <button class="primary" onclick="go('character')">Prepare</button></div><div class="card"><span class="eyebrow">Your next destination</span><h2>Coral Beach and beyond</h2><p>Three regions · 32 rooms · return with what you can keep.</p><button onclick="go('gate')">Review expedition</button></div></div><div class="rule"></div><h2>People in the square</h2><div class="grid three">${Object.entries(services).map(([screen,[name,line]])=>`<div class="card"><span class="tag">${ready(screen)?'Open':'Not restored'}</span><h3>${esc(name)}</h3><p class="muted">${esc(line)}</p><button onclick="go('${screen}')">${ready(screen)?'Visit':'Learn how to reopen'}</button></div>`).join('')}</div><div class="rule"></div><h2>Quiet conversations</h2><div class="tabs">${['Miranda','Stella','Copper Plate'].map(n=>`<button onclick="lore('${n}')">${n}</button>`).join('')}</div>${state.receipts.length?'<div class="rule"></div><h3>Recent changes</h3>'+state.receipts.slice(0,3).map(r=>'<p class="muted">'+esc(r)+'</p>').join(''):''}`}
function characterScreen(){return head('Choose the build you leave with.','Changes here belong to the selected character. Your collection and banked resources are shared.')+`<div class="grid"><div class="card"><h2>${esc(cls().name)}</h2><p>${esc(cls().text)}</p><button onclick="openCharacters()">Switch character · stay in town</button></div><div class="card"><h3>Starting technique</h3><p>${skillChoice()?esc(skillChoice().name)+' · Lv '+state.mastery[prep().skill]:'Class techniques only'}</p><button onclick="go('mastery')">Manage with Louis</button></div><div class="card"><h3>Equipment & wardrobe</h3><p>${Object.values(prep().equipment).filter(Boolean).length} stored items selected. Your class starter fills an empty weapon slot.</p><button onclick="go('warehouse')">Manage with Julio</button></div><div class="card"><h3>Drill & server settings</h3><p>Heat ${heat()} · ${prep().drill?esc(DATA.drills.find(x=>x.id===prep().drill).name):'No selected drill'}</p><button onclick="go('drills')">Choose drill</button> <button onclick="go('difficulty')">Server settings</button></div></div><div class="rule"></div><h2>Attributes at departure</h2><div class="grid three">${[['Power',['AP','AC','DX']],['Magic',['MP','MA','MD']],['Sense',['WT','DA','LK']],['Charm',['HP','DP','HV']]].map(([n,keys])=>`<div class="card"><h3>${n}</h3>${keys.map(k=>`<div class="row"><span>${k}</span><strong>${stats()[k]}</strong></div>`).join('')}</div>`).join('')}</div><div class="actions"><button class="primary" onclick="go('gate')">Review expedition →</button></div>`}
function equipmentScreen(){const wardrobe=tabs.equipment==='wardrobe',slots=['weapon','hat','shield','innerwear','acc1','acc2'];return head('Equipment & wardrobe','Shared collection. Separate preparation for '+cls().name+'. Worn gear keeps its full strength.')+`<div class="tabs"><button class="${!wardrobe?'active':''}" onclick="tabs.equipment='gear';render()">Equipment</button><button class="${wardrobe?'active':''}" onclick="tabs.equipment='wardrobe';render()">Wardrobe · permanent bonuses</button></div>`+(wardrobe?`<div class="grid">${['ear','tail','head','face','cape','speed'].map(slot=>`<div class="card"><span class="eyebrow">${slot}</span><h3>${prep().wardrobe[slot]?esc(ward(prep().wardrobe[slot]).name):'Nothing selected'}</h3><p class="muted">${prep().wardrobe[slot]?esc(ward(prep().wardrobe[slot]).text):'An empty slot is a valid choice.'}</p>${DATA.wardrobe.filter(w=>w.slot===slot&&state.owned.includes(w.id)).map(w=>`<button onclick="wear('${slot}','${w.id}')">${prep().wardrobe[slot]===w.id?'Wearing':'Wear'} ${esc(w.name)}</button>`).join('')}<button onclick="wear('${slot}',null)">Wear nothing</button></div>`).join('')}</div>`:`<div class="split"><div><div class="grid">${slots.map(slot=>`<button class="card ${selected.slot===slot?'selected':''}" onclick="selected.slot='${slot}';render()"><span class="eyebrow">${slot==='acc1'?'Necklace':slot==='acc2'?'Ring':slot}</span><div class="title">${prep().equipment[slot]?esc(title(item(prep().equipment[slot]))):slot==='weapon'?'Class starter':'Empty'}</div></button>`).join('')}</div><div class="notice warn" style="margin-top:18px">Gear you wear is at stake on defeat. Gear left on the shelves stays safe. Review the exact loss rule at the expedition gate.</div></div><div class="card detail"><h3>Choose ${esc(selected.slot)}</h3><p class="muted">Incompatible items stay on your shelves.</p><div class="list">${state.items.filter(x=>{const slot=itemData(x).slot;return slot===selected.slot||(slot==='acc1'&&selected.slot==='acc2')}).map(x=>`<button ${!compatible(x)?'disabled':''} onclick="equip('${x.uid}','${selected.slot}')"><strong>${esc(title(x))}</strong><small>${compatible(x)?statLine(equipStats(x)):'Not usable by '+cls().name}</small></button>`).join('')||'<p class="muted">No stored items for this slot.</p>'}</div><button onclick="delete prep().equipment[selected.slot];receipt('Preparation updated. Your stored item stays safe.')">${selected.slot==='weapon'?'Use class starter':'Leave slot empty'}</button></div></div>`)}
function equip(uid,slot){const x=item(uid);if(!x||!compatible(x))return toast('This item is not compatible with this character.');Object.keys(prep().equipment).forEach(k=>{if(prep().equipment[k]===uid)delete prep().equipment[k]});prep().equipment[slot]=uid;if(itemData(x).family==='gun')delete prep().equipment.shield;receipt(title(x)+' selected for '+cls().name+'.')}
function wear(slot,id){if(id&&!state.owned.includes(id))return;id?prep().wardrobe[slot]=id:delete prep().wardrobe[slot];receipt('Wardrobe and attribute preview updated for '+cls().name+'.')}
function restoreScreen(){const r=restoration(selected.restore)||DATA.restorations[0],lvl=state.restored[r.id],max=lvl>=r.max,cost={tm:r.tm[lvl]||0,shards:r.shards[lvl]||0};let benefit=r.effect==='max_hp'?`All characters: +${lvl*15} → +${(lvl+1)*15} starting HP.`:r.effect==='room_mp'?`All characters: +${lvl*15} → +${(lvl+1)*15} MP recovered on room entry.`:r.text;return head('Restore what matters to you.','See what each purchase opens, what it costs, and when you can use it.')+`<div class="split"><div class="list">${DATA.restorations.map(x=>`<button class="${x.id===r.id?'selected':''}" onclick="selected.restore='${x.id}';render()"><strong>${esc(x.name)}</strong><small>${state.restored[x.id]}/${x.max} · ${state.restored[x.id]>=x.max?'Complete':money({tm:x.tm[state.restored[x.id]],shards:x.shards[state.restored[x.id]]})}</small></button>`).join('')}</div><div class="card detail"><span class="tag">Shared town progression</span><h2>${esc(r.name)}</h2><p>${max?'Fully restored.':esc(benefit)}</p>${r.id==='skill_shrine'&&!state.restored.compounders_stall?'<div class="notice warn">Mastery needs monster materials. Normal material drops require Compounder’s Stall. Restored run shops or drilling can also supply materials. You may restore Louis first.</div>':''}<p class="cost">${max?'No further ranks':money(cost)}</p><button class="primary" ${max||!afford(cost)?'disabled':''} onclick="buyRestoration('${r.id}')">${max?'Restored':lvl?'Upgrade to rank '+(lvl+1):'Restore '+esc(r.name)}</button>${!max&&!afford(cost)?'<p class="muted" style="margin-top:12px">Keep playing to earn the missing banked resources. No other service is required to leave town.</p>':''}</div></div>`}
function buyRestoration(id){const r=restoration(id),lvl=state.restored[id];if(lvl>=r.max||!pay({tm:r.tm[lvl],shards:r.shards[lvl]}))return;state.restored[id]++;if(id==='drill_shop'&&!state.drills.includes('basic_drill')){state.drills.push('basic_drill');prep().drill='basic_drill'}receipt(r.name+' restored. Its benefit is included in your next expedition preview.')}
function refineScreen(){const x=item(selected.refine)||state.items[0];if(!x)return head('Refine stored equipment','Bank a piece of equipment during an expedition to bring it to Marx.')+'<div class="empty">Your collection has no stored equipment yet.</div>';selected.refine=x.uid;const cost={galder:(50+40*x.refine)*3,ore:1+Math.floor(x.refine/2)},chances=[95,88,76,62,48,36,26,18,12,8],next={...x,refine:Math.min(10,x.refine+1)},can=!!itemData(x).refine_stat&&x.refine<10;return head('Refine a piece you want to keep.','Town forging is safe to access. Galder costs three times a run anvil, and uses base success odds.')+`<p class="cost">Banked: ${state.wallet.galder} Galder · ${state.wallet.ore} Bronze Fragments</p><div class="split"><div class="list">${state.items.map(g=>`<button class="${g.uid===x.uid?'selected':''}" onclick="selected.refine='${g.uid}';render()"><strong>${esc(title(g))}</strong><small>${statLine(equipStats(g))}</small></button>`).join('')}</div><div class="card detail"><h2>${esc(title(x))}</h2><p>Current: ${statLine(equipStats(x))}</p><p><strong>On success:</strong> ${statLine(equipStats(next))}</p><p class="big">${can?chances[x.refine]+'% success':'No further refinement'}</p><p>${x.refine>=4?'Failure may lower this item by one refine level.':'Failure spends the materials; this refine level is kept.'}</p><p class="cost">${money(cost)}</p><button class="primary" ${!can||!afford(cost)?'disabled':''} onclick="requestRefine('${x.uid}')">Attempt +${x.refine+1}</button><p class="muted" style="margin-top:12px">Only this attempt is purchased. The result stays open; no repeat is queued.</p></div></div>`}
function requestRefine(uid){const x=item(uid);if(x.refine>=4)confirmBox('Risk a refine level?',title(x)+' may lose one refine level on failure. The materials are spent either way.',()=>refine(uid),'Attempt refinement');else refine(uid)}
function refine(uid){const x=item(uid);if(!x||x.refine>=10||!itemData(x).refine_stat)return;const cost={galder:(50+40*x.refine)*3,ore:1+Math.floor(x.refine/2)};if(!pay(cost))return;const success=state.refineAttempt++%3!==2;if(success)x.refine++;else if(x.refine>=4)x.refine--;receipt(success?'Refinement succeeded: '+title(x)+'. Preparation updated.':'Refinement failed. Materials spent; resulting item: '+title(x)+'.')}
function compoundScreen(){const m=mat(selected.material)||DATA.materials[0],x=item(selected.compoundItem)||state.items[0];return head('Choose the material, then the item.','Compounds permanently fill a slot. Town rolls use base quality; expedition compounding can benefit from DA.')+`<div class="split"><div class="list">${DATA.materials.filter(a=>state.materials[a.id]>0||a.id===m.id).map(a=>`<button class="${a.id===m.id?'selected':''}" onclick="selected.material='${a.id}';render()"><strong>${esc(a.name)}</strong><small>${state.materials[a.id]||0} / ${a.need} · ${esc(a.stat)} ${a.min}–${a.max}</small></button>`).join('')}</div><div class="card"><h2>${esc(m.name)}</h2><p>Consumes ${m.need} · adds ${esc(m.stat)} ${m.min}–${m.max}.</p><p class="muted">Found from ${esc(m.source)}, ${esc(m.region)}.</p><button onclick="trackMaterial('${m.id}')">Track material</button><div class="rule"></div><h3>Set into</h3><div class="list">${state.items.map(g=>`<button class="${x&&x.uid===g.uid?'selected':''}" ${g.compounds.length>=itemData(g).slots?'disabled':''} onclick="selected.compoundItem='${g.uid}';render()">${esc(title(g))}<small>${Math.max(0,itemData(g).slots-g.compounds.length)} free slot(s) · ${statLine(equipStats(g))}</small></button>`).join('')||'<p>No stored items yet.</p>'}</div>${x?`<div class="notice warn" style="margin-top:14px">Use 1 permanent slot on ${esc(title(x))}. This prototype proposes an explicit commitment before consuming a slot.</div><button class="primary" ${(state.materials[m.id]||0)<m.need||x.compounds.length>=itemData(x).slots?'disabled':''} onclick="confirmCompound('${m.id}','${x.uid}')">Set ${esc(m.name)}</button>`:''}</div></div>`}
function confirmCompound(mid,uid){const m=mat(mid),x=item(uid);confirmBox('Fill this compound slot?',`Use ${m.need} ${m.name} on ${title(x)} for ${m.stat} ${m.min}–${m.max}. The filled slot cannot currently be cleared.`,()=>{if((state.materials[mid]||0)<m.need||x.compounds.length>=itemData(x).slots)return toast('The item or materials changed. Review the selection.');state.materials[mid]-=m.need;const value=Math.round((m.min+m.max)/2);x.compounds.push({stat:m.stat,value});receipt(m.name+' set: '+m.stat+' +'+value+'. Item and preparation updated.')},'Fill slot')}
function masteryScreen(){const list=cls().mastery,c=list.find(a=>a.id===selected.mastery)||list.find(a=>a.id===prep().skill)||list[0];if(!c)return head('Starting technique','No eligible starting techniques are configured for this character.')+'<button onclick="openCharacters()">Choose another character</button>';selected.mastery=c.id;const lv=state.mastery[c.id]||0,cost={galder:500*(lv+1)},need=6*(lv+1),have=state.materials[c.material]||0;return head('One technique. Your choice.','Mastery is shared for the technique; the carried selection belongs to '+cls().name+'. Selected techniques always remain manageable.')+`<div class="split"><div class="list"><button onclick="prep().skill=null;receipt('Starting selection cleared for '+cls().name+'.')">Class techniques only</button>${list.map(a=>`<button class="${c.id===a.id?'selected':''}" onclick="selected.mastery='${a.id}';render()"><strong>${esc(a.name)}</strong><small>${a.kind} · ${state.mastery[a.id]?'Mastery '+state.mastery[a.id]:'Not mastered'}${prep().skill===a.id?' · Selected':''}</small></button>`).join('')}</div><div class="card detail"><span class="tag">${esc(c.kind)}</span><h2>${esc(c.name)}</h2><p>${esc(c.levels?.[Math.max(lv-1,0)]||c.text)}</p>${lv>0&&lv<3?`<p class="muted">Next mastery: ${esc(c.levels?.[lv]||c.text)}</p>`:''}<p><strong>Starting level: ${lv} → ${Math.min(lv+1,3)}</strong></p><p>${have} / ${need} ${esc(c.material_name)} · ${500*(lv+1)} Galder</p><button class="primary" ${lv>=3||have<need||!afford(cost)?'disabled':''} onclick="buyMastery('${c.id}')">${lv>=3?'Fully mastered':'Master to level '+(lv+1)}</button><button ${lv===0?'disabled':''} onclick="selectMastery('${c.id}')">${prep().skill===c.id?'Selected for departure':'Carry this technique'}</button><div class="rule"></div><p class="muted">${esc((mat(c.material)||{}).source||'Monster material')} · ${esc((mat(c.material)||{}).region||'Expedition')}</p><button onclick="trackMaterial('${c.material}')">Track required material</button><p class="muted" style="margin-top:12px">Only techniques eligible at this character’s first job appear here. Mastering and selecting are separate actions.</p></div></div>`}
function selectMastery(id){const c=cls().mastery.find(x=>x.id===id);if(!c||!state.mastery[id])return;prep().skill=id;receipt(c.name+' selected for '+cls().name+'.')}
function buyMastery(id){const c=cls().mastery.find(x=>x.id===id),lv=state.mastery[id]||0;if(lv>=3||(state.materials[c.material]||0)<6*(lv+1)||!pay({galder:500*(lv+1)}))return;state.materials[c.material]-=6*(lv+1);state.mastery[id]=lv+1;receipt(c.name+' mastered to level '+(lv+1)+'.'+(prep().skill===id?' Your selected starting technique updated.':' Select it when you want to carry it.'))}
function cardsScreen(){return head('Every hunt leaves a page behind.','Cards count toward overlapping sets. Claiming a reward does not consume your cards.')+`<div class="tabs"><button class="${tabs.cards==='sets'?'active':''}" onclick="tabs.cards='sets';render()">Collection sets</button><button class="${tabs.cards==='shop'?'active':''}" onclick="tabs.cards='shop';render()">Reward shop</button></div>`+(tabs.cards==='sets'?`<div class="grid">${DATA.sets.map(s=>{const n=s.monsters.filter(id=>state.cards.includes(id)).length,w=ward(s.reward);return `<div class="card"><span class="tag">${n}/${s.monsters.length} cards</span><h3>${esc(s.name)}</h3><p>${esc(w.name)} · ${esc(w.text)}</p><p class="muted">Missing: ${s.monsters.filter(id=>!state.cards.includes(id)).map(id=>esc(id.replaceAll('_',' '))).join(', ')||'None'}</p><button class="primary" ${state.claimed.includes(s.id)||n<s.monsters.length?'disabled':''} onclick="claimSet('${s.id}')">${state.claimed.includes(s.id)?'Claimed':'Claim reward'}</button> <button onclick="trackSet('${s.id}')">Track set</button></div>`}).join('')}</div><div class="notice" style="margin-top:18px">Caballa Relics set rewards are not yet configured in the current game. The journal should still show cards found there; it should not imply an unavailable reward.</div>`:`<div class="grid">${DATA.wardrobe.filter(w=>w.tm>0).map(w=>`<div class="card"><span class="tag">${esc(w.slot)}</span><h3>${esc(w.name)}</h3><p>${esc(w.text)}</p><small>${statLine(w.stats)}</small><p class="cost">${money({tm:w.tm,shards:w.shards})}</p><button ${state.owned.includes(w.id)||!afford({tm:w.tm,shards:w.shards})?'disabled':''} onclick="buyWardrobe('${w.id}')">${state.owned.includes(w.id)?'Owned':'Buy for collection'}</button></div>`).join('')}</div>`)}
function claimSet(id){const s=DATA.sets.find(x=>x.id===id);if(state.claimed.includes(id)||!s.monsters.every(m=>state.cards.includes(m)))return;state.claimed.push(id);if(!state.owned.includes(s.reward))state.owned.push(s.reward);receipt(ward(s.reward).name+' claimed. Your current wardrobe has not changed.')}
function buyWardrobe(id){const w=ward(id);if(state.owned.includes(id)||!pay({tm:w.tm,shards:w.shards}))return;state.owned.push(id);receipt(w.name+' added to the shared collection. Choose whether to wear it with Julio.')}
function drillsScreen(){const d=DATA.drills.find(x=>x.id===selected.drill)||DATA.drills[0];return head('Go deeper. Know the handling.','Tools are shared. The selected drill belongs to your prepared character. Practice does not spend resources.')+`<div class="split"><div class="list">${DATA.drills.map(x=>`<button class="${d.id===x.id?'selected':''}" onclick="selected.drill='${x.id}';render()"><strong>${esc(x.name)}</strong><small>Depth ${x.depth} · ${prep().drill===x.id?'Selected':state.drills.includes(x.id)?'Owned':money({tm:x.tm,shards:x.shards})}</small></button>`).join('')}</div><div class="card detail"><h2>${esc(d.name)}</h2><div class="metric"><strong>${d.depth}</strong>maximum depth</div><div class="metric"><strong>${(d.zone/d.speed).toFixed(3)} s</strong>base good-strike window</div><p>${d.strikes} strikes · ${d.scoop} depth per good hit · ${Math.round(d.zone*100)}% base zone.</p><p>Your DA widens the zone. Faster markers require more precise timing.</p><div class="notice"><strong>Reachable reward tiers</strong><br>Ore at 5 · materials at 15${d.depth>=40?' · gear at 40':''}${d.depth>=70?' · shard at 70':''}.</div><div class="actions"><button onclick="practice('${d.id}')">Try handling · no rewards</button>${state.drills.includes(d.id)?`<button class="primary" onclick="prep().drill='${d.id}';receipt('${d.name} selected for '+cls().name+'.')">${prep().drill===d.id?'Selected':'Carry this drill'}</button>`:`<button class="primary" ${!afford({tm:d.tm,shards:d.shards})?'disabled':''} onclick="buyDrill('${d.id}')">Buy · ${money({tm:d.tm,shards:d.shards})}</button>`}</div><p class="muted" style="margin-top:12px">Three misses can trigger an ambush. The design preserves discovered gear until that fight is resolved.</p></div></div>`}
function buyDrill(id){const d=DATA.drills.find(x=>x.id===id);if(state.drills.includes(id)||!pay({tm:d.tm,shards:d.shards}))return;state.drills.push(id);receipt(d.name+' purchased. Select it to change the drill you carry.')}
function difficultyScreen(){const ranks=draftSettings||state.settings,h=heat(ranks);return head('Choose your expedition’s rules.','Changes apply to the next expedition after you save. Each Heat adds 10% TM and 3 levels to gear offer bands.')+`<div class="notice"><strong>Heat ${h} · +${h*10}% TM · gear bands +${h*3} levels</strong><br>Account best: ${state.bestHeat<0?'none':state.bestHeat}. New-clear bounty at this setting: ${h>state.bestHeat?h-Math.max(state.bestHeat,0):0} shard(s).</div><div class="list">${Object.entries(DATA.settings).map(([id,x])=>`<div class="card row"><div><h3>${esc(x.name)} · ${(ranks[id]||0)}/${x.max}</h3><p class="muted">${esc(x.text)}</p><small>${x.heat} Heat per rank</small></div><div style="display:flex;gap:6px"><button aria-label="Decrease ${esc(x.name)}" ${(ranks[id]||0)===0?'disabled':''} onclick="adjustSetting('${id}',-1)">−</button><button aria-label="Increase ${esc(x.name)}" ${(ranks[id]||0)>=x.max?'disabled':''} onclick="adjustSetting('${id}',1)">+</button></div></div>`).join('')}</div><div class="actions"><button class="primary" ${!draftSettings?'disabled':''} onclick="state.settings={...draftSettings};draftSettings=null;receipt('Server settings saved for the next expedition.')">Save server settings</button><button ${!draftSettings?'disabled':''} onclick="draftSettings=null;render()">Discard changes</button></div><p class="muted" style="margin-top:14px">New best-Heat bounties are shared across characters. Healing spells and rest-stop recovery remain available under Hardcore.</p>`}
function adjustSetting(id,by){if(!draftSettings)draftSettings={...state.settings};draftSettings[id]=Math.max(0,Math.min(DATA.settings[id].max,(draftSettings[id]||0)+by));render()}
function trackMaterial(id){const m=mat(id);if(!m)return toast('This source is not configured.');state.goal={name:'Collect '+m.name,source:m.source+' · '+m.region};receipt('Hunting goal tracked. Your departure choices have not changed.')}
function trackSet(id){const s=DATA.sets.find(x=>x.id===id);state.goal={name:s.name+' collection',source:'Missing cards: '+(s.monsters.filter(m=>!state.cards.includes(m)).map(m=>m.replaceAll('_',' ')).join(', ')||'None — ready to claim')};receipt('Collection goal tracked.')}
function journalScreen(){return head('Know what you are hunting.','A quiet place for your goal, recent results, and people’s discoveries.')+`<div class="card"><h2>${state.goal?esc(state.goal.name):'No tracked hunt'}</h2><p>${state.goal?esc(state.goal.source):'Louis, Paul and Eugene can point you toward a material or collection.'}</p><div class="actions"><button onclick="go('mastery')">Find a mastery goal</button><button onclick="go('cards')">Browse collections</button></div></div><div class="rule"></div><h2>Material sources</h2><label for="search">Search by material, monster, or region</label><input id="search" type="search" value="${esc(search)}" oninput="search=this.value;renderSearch()"><div id="journalResults" class="list" style="margin-top:14px">${journalRows()}</div>`}
function journalRows(){return DATA.materials.filter(m=>(m.name+' '+m.source+' '+m.region).toLowerCase().includes(search.toLowerCase())).map(m=>`<button onclick="trackMaterial('${m.id}')"><strong>${esc(m.name)}</strong><small>${esc(m.source)} · ${esc(m.region)} · carried home: ${state.materials[m.id]||0}</small></button>`).join('')||'<div class="empty">No matching sources.</div>'}
function renderSearch(){$('journalResults').innerHTML=journalRows()}
function lossPreview(){const worn=Object.values(prep().equipment).map(item).filter(Boolean).sort((a,b)=>itemData(a).weight-itemData(b).weight||a.uid.localeCompare(b.uid));let remaining=Math.floor(stats().WT/4),saved=[],bag=[];worn.forEach(x=>{if(saved.length<worn.length-1&&itemData(x).weight<=remaining){saved.push(title(x));remaining-=itemData(x).weight}else bag.push(title(x))});return {saved,bag,capacity:Math.floor(stats().WT/4)}}
function gateScreen(){const loss=lossPreview();return head('Ready when you are.','Review the choices that matter. Nothing here requires you to spend before leaving.')+`<div class="route"><span>Coral Beach · 10 rooms</span> → <span>Rest stop</span> → <span>Desert Beach · 10 rooms</span> → <span>Rest stop</span> → <span>Caballa Relics · 10 rooms</span></div><div class="rule"></div>${!state.restored.job_hall?'<div class="notice warn">Job Hall is closed. This expedition will not offer job changes. <button onclick="selected.restore=\'job_hall\';go(\'restore\')">View restoration</button></div>':''}<div class="grid"><div class="card"><h2>${esc(cls().name)}</h2><p>${esc(cls().basic)}</p><p>Starting technique: ${skillChoice()?esc(skillChoice().name)+' · Lv '+state.mastery[prep().skill]:'class techniques only'}</p><p>${Object.values(prep().equipment).map(item).filter(Boolean).map(x=>esc(title(x))).join(' · ')||'Class starter; no stored gear at stake'}</p><button onclick="go('character')">Change preparation</button></div><div class="card"><h2>Heat ${heat()}</h2><p>+${heat()*10}% TM · gear offer bands +${heat()*3} levels.</p><p>Drill: ${prep().drill?esc(DATA.drills.find(x=>x.id===prep().drill).name):state.restored.drill_shop?'Basic Drill':'not available'}</p><button onclick="go('difficulty')">Change server settings</button></div></div><div class="card" style="margin-top:16px"><h3>What you are risking</h3><p>On defeat, WT can save some worn gear; at least one eligible piece goes into a lost bag.</p><p><strong>Based on this loadout:</strong> ${loss.bag.length?'Bag: '+esc(loss.bag.join(', '))+'.':'No stored items selected.'} ${loss.saved.length?'Saved by WT: '+esc(loss.saved.join(', '))+'.':''}</p><p class="muted">WT save capacity: ${loss.capacity}. Empty shelves may also be needed for found items. Another defeat with gear to lose can replace your previous lost bag.</p></div><div class="actions"><button onclick="go('town')">Stay in town</button><button class="primary" onclick="depart()">Begin expedition →</button></div>`}
function depart(){if(Object.values(prep().equipment).map(item).some(x=>!x||!compatible(x)))return toast('Resolve incompatible equipment before departure.');const snapshot=JSON.parse(JSON.stringify({hero:state.hero,preparation:prep(),settings:state.settings}));window.lastDeparture=snapshot;showModal('Expedition prepared',`<p><strong>${esc(cls().name)}</strong> would leave with the preparation you just reviewed.</p><p>This is the end of the design prototype. No game scene has started and no game save has changed.</p><button class="primary" onclick="closeModal()">Back to the prototype</button>`)}
function openCharacters(){showModal('Who stays in the square?',`<p>Switching characters keeps you in town. Each character remembers its own preparation.</p><div class="grid">${DATA.classes.map(c=>`<div class="card"><span class="tag">${c.id===state.hero?'Selected':'Available'}</span><h3>${esc(c.name)}</h3><p>${esc(c.basic)}</p><button onclick="switchHero('${c.id}')">${c.id===state.hero?'Keep preparing':'Switch to '+esc(c.name)}</button></div>`).join('')}</div><div class="actions"><button onclick="closeModal()">Back</button><button onclick="creation(0,{})">Create a Trickster · flow study</button></div>`,true)}
function switchHero(id){state.hero=id;selected.mastery=null;closeModal();receipt(DATA.classes.find(x=>x.id===id).name+' selected. You are still in town.')}
function creation(step,draft){const stages=[['Fighting style',['Sword','Hammer','Fists']],['Growth graph',['Power / Charm','Magic / Sense','Sense / Power','Charm / Magic','Balanced']],['First tree',['Knight','Boxer','Bard']],['Second tree',['Knight','Boxer','Explorer']]],s=stages[step];if(!s){showModal('Review your Trickster',`<p>${Object.values(draft).map(esc).join(' · ')}</p><p class="notice">Creation is shown as a reversible flow only. Compatibility and unlock validation must come from the game; this demo does not create or unlock a playable class.</p><div class="actions"><button onclick='creation(3,${JSON.stringify(draft)})'>Back</button><button onclick="closeModal()">Cancel creation</button></div>`);return}showModal(`Create a Trickster · ${step+1}/4`, `<h3>${s[0]}</h3><div class="list">${s[1].filter(x=>step!==3||x!==draft[2]).map(x=>{const next={...draft,[step]:x};return `<button onclick='creation(${step+1},${JSON.stringify(next)})'>${esc(x)}</button>`}).join('')}</div><div class="actions">${step?`<button onclick='creation(${step-1},${JSON.stringify(draft)})'>Back</button>`:''}<button onclick="closeModal()">Cancel creation</button></div>`)}
function openReturn(){showModal('What came home',`<span class="tag">Last expedition · defeated</span><h3>Reached Desert Beach, room 3</h3><p>+2,480 TM · +1 shard were banked. Stored equipment and materials can now be used in town.</p><div class="notice warn">A lost bag remains in Desert Beach, room 3. Reaching that room on a later expedition lets you recover it. Another defeat with gear to lose can replace it.</div><p>Items on town shelves remain safe. Your character’s run level and learned run techniques reset.</p><div class="actions"><button onclick="closeModal()">Continue in town</button><button onclick="closeModal();go('journal')">Open journal</button></div>`)}
function showConversation(){showModal(services[view][0],`<p>Conversation is an optional sibling to the service after the first meeting. New milestones can introduce a short conversation once, without replaying the introduction for every transaction.</p><button class="primary" onclick="closeModal()">Return to ${esc(names[view])}</button>`)}
function lore(name){const lines={Miranda:'Miranda is here to talk. Her potion shop is not currently an implemented service.',Stella:'Stella keeps the story of the shards. Discovery milestones should be remembered even after you spend a shard.','Copper Plate':'The shutdown notice changes after your first expedition clear. Region victories and full expedition clears are tracked separately.'};showModal(name,`<p>${lines[name]}</p><button onclick="closeModal()">Back to the square</button>`)}
function showModal(title,html,wide=false){closeModal();const previous=document.activeElement;$('modalRoot').innerHTML=`<div class="overlay"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${html}</section></div>`;modalCancel=()=>{if(previous?.isConnected)previous.focus()};$('modalRoot').querySelector('button')?.focus()}
function closeModal(){if(practiceTimer){clearInterval(practiceTimer);practiceTimer=null}if($('modalRoot'))$('modalRoot').innerHTML='';const cb=modalCancel;modalCancel=null;cb?.()}
function confirmBox(title,text,action,label,backLabel='Back'){showModal(title,`<p>${esc(text)}</p><div class="actions"><button onclick="closeModal()">${esc(backLabel)}</button><button class="primary" id="confirmAction">${esc(label)}</button></div>`);$('confirmAction').onclick=()=>{closeModal();action()}}
function practice(id){const d=DATA.drills.find(x=>x.id===id),zone=Math.min(.5,d.zone+stats().DA/400);showModal('Try '+d.name,`<p>Click Strike or press Space when the marker crosses the green zone. Practice has no costs or rewards.</p><div class="bar"><div class="zone" style="left:${(0.5-zone/2)*100}%;width:${zone*100}%"></div><div id="practiceMarker" class="marker"></div></div><p id="practiceResult" role="status">Ready.</p><div class="actions"><button id="strikePractice">Strike [Space]</button><button onclick="closeModal()">Finish practice</button></div>`);let t=0,position=0;$('strikePractice').onclick=()=>{const off=Math.abs(position-.5);$('practiceResult').textContent=off<=zone/6?'Perfect — more depth.':off<=zone/2?'Good strike.':'Miss — try again; no cost.'};practiceTimer=setInterval(()=>{t+=.016;const x=(t*d.speed)%2;position=x<=1?x:2-x;if($('practiceMarker'))$('practiceMarker').style.left=position*100+'%'},16)}
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,4500)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalRoot').children.length){e.preventDefault();closeModal();return}if(e.code==='Space'&&practiceTimer){e.preventDefault();$('strikePractice')?.click();return}if(e.key==='Escape'&&!$('modalRoot').children.length&&view!=='town'){e.preventDefault();go('town');return}if(e.key==='Tab'&&$('modalRoot').children.length){const nodes=[...$('modalRoot').querySelectorAll('button:not(:disabled),input,select')],first=nodes[0],last=nodes.at(-1);if(!nodes.length)return;if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.hubDemo={get state(){return state},get view(){return view},reset:resetDemo,go};resetDemo();
</script></body></html>
